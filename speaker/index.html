<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Swift Games &amp; Ares Interactive, 2026 Business Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F5F6F8; --surface:#FFFFFF;
 --ink:#181A20; --body:#5F6673; --muted:#667085; --faint:#98A2B3;
 --line:#E2E5EA; --lineSoft:#EFF1F4;
 --demand:#5B50D6; --demandSoft:#F2F0FF; --demandInk:#473DB5; --demandBd:#DCD8FA;
 --supply:#475467; --supplySoft:#F2F4F7; --supplyInk:#344054; --supplyBd:#D0D5DD;
 --pos:#176B49; --posSoft:#EDF7F2; --neg:#A83F3B; --negSoft:#FCEFED; --accent:#87530D; --accentSoft:#FFF7E8;
 --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --sh1:0 1px 3px rgba(11,11,11,.04);
 --sh2:0 1px 3px rgba(11,11,11,.05);
 --sh3:0 2px 4px rgba(15,17,23,.05),0 30px 60px -30px rgba(15,17,23,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-family:var(--font);color:var(--body);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv02","cv03","cv04","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
 background:radial-gradient(1000px 640px at 100% -12%, transparent, transparent 62%),
  radial-gradient(900px 640px at 0% 110%, transparent, transparent 62%);}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}

/* dark theme */





header{background:rgba(255,255,255,.85);backdrop-filter:saturate(160%) blur(12px);position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line)}
.hbar{display:flex;align-items:center;gap:16px;padding:17px 32px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em}
.brand .dot{width:11px;height:11px;background:var(--demand);transform:rotate(45deg);border-radius:2px}
.htitle{font-size:12.5px;color:var(--muted);font-weight:500;border-left:1px solid var(--line);padding-left:16px}
.htitle b{color:var(--ink);font-weight:700}
.hper{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;font-weight:500}
nav.tabs{display:flex;gap:2px;max-width:1080px;margin:0 auto;padding:0 24px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;
 padding:13px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--demand);border-bottom-color:var(--demand)}
nav.tabs button .pip{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle}

#main{padding-top:44px;padding-bottom:120px}
.tab{display:none;animation:fade .3s ease}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;border-radius:24px;padding:46px 46px 40px;overflow:hidden;
 background:linear-gradient(135deg,#F3E8FF 0%,#FBFAF7 42%,#E4F5EE 100%);border:1px solid var(--line);box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;right:-80px;top:-90px;width:280px;height:280px;border-radius:50%;
 background:none}
.hero::after{content:"";position:absolute;right:60px;bottom:-120px;width:260px;height:260px;border-radius:50%;
 background:none}
.hero .ey{position:relative}
.hero h1{position:relative;font-size:46px;font-weight:800;letter-spacing:-.035em;color:var(--ink);line-height:1.04;margin-bottom:16px}
.hero .hsub{position:relative;font-size:15.5px;color:var(--body);max-width:640px;line-height:1.65}
.hero .titles{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .titles span{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:6px 15px 6px 6px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:none}

.heroInner{display:grid;grid-template-columns:1.06fr .94fr;gap:46px;align-items:center;position:relative}
.hero-copy{position:relative}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.statgrid .st{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--sh1);transition:transform .2s,box-shadow .2s}
.statgrid .st:hover{box-shadow:var(--sh1)}


/* hero, coherent with the deck */
.hero2{position:relative;padding:36px 42px;border-radius:18px;overflow:hidden;background:linear-gradient(125deg,#25203F 0%,#373063 52%,#5146A8 100%);box-shadow:0 16px 40px -28px rgba(25,22,50,0.55)}
.hero2 .ic-badge{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.12);color:#E9E7FF;padding:7px 15px;border-radius:30px;opacity:0;animation:rise .6s .05s ease forwards}
.hero2 h1{font-size:clamp(38px,5.2vw,62px);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:16px 0 0;color:#fff;opacity:0;animation:rise .6s .12s ease forwards}
.hero2 .sub{font-size:clamp(14.5px,1.4vw,17px);color:#CFCBE8;max-width:720px;margin-top:18px;line-height:1.6;opacity:0;animation:rise .6s .2s ease forwards}
.hero2 .sub b{color:#fff;font-weight:700}
.hero2 .titles{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;opacity:0;animation:rise .6s .28s ease forwards}
.hero2 .titles span{display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 15px 8px 8px;font-size:13.5px;font-weight:600;color:#fff;box-shadow:none}
.hero2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px;opacity:0;animation:rise .7s .36s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:820px){ .hero2-stats{grid-template-columns:1fr 1fr} }
.statband{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);overflow:hidden}
.statband .st{padding:22px 24px;border-right:1px solid var(--lineSoft)}
.statband .st:last-child{border-right:none}
.st .lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.st .val{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:10px 0 8px;line-height:1;font-variant-numeric:tabular-nums}
.st .val.dem{color:var(--demand)} .st .val.sup{color:var(--supply)}
.trend{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.trend.good{background:var(--posSoft);color:var(--pos)} .trend.bad{background:var(--negSoft);color:var(--neg)}
.trend.flat{background:var(--lineSoft);color:var(--muted)}

.ey{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--demandInk);margin-bottom:16px}
.lead{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.1;margin-bottom:16px}
.sublead{font-size:15px;color:var(--body);max-width:720px;line-height:1.65}

.sec{margin:52px 0 20px;padding-left:13px;border-left:3px solid var(--demand)}
.sec h3{scroll-margin-top:96px}
.sec .ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
 background:var(--demandSoft);color:var(--demandInk)}
.sec.s .ic{background:var(--supplySoft);color:var(--supplyInk)}
.sec.n .ic{background:linear-gradient(135deg,var(--demand),var(--supply));color:#fff}
.sec .ic svg{width:16px;height:16px}
.sec h3{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .pill{flex:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:5px 12px;border-radius:20px;text-transform:uppercase}
.pill.dem{background:var(--demandSoft);color:var(--demandInk)}
.pill.sup{background:var(--supplySoft);color:var(--supplyInk)}
.pill .pip{width:6px;height:6px;border-radius:50%}
.pill.dem .pip{background:var(--demand)} .pill.sup .pip{background:var(--supply)}

.grid{display:grid;gap:22px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:none}
.card:hover{box-shadow:none}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 22px;box-shadow:var(--sh1);transition:transform .2s,box-shadow .2s}
.k:hover{box-shadow:var(--sh1)}
.k .khead{display:flex;align-items:center;gap:9px;color:var(--muted)}
.k .kic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--lineSoft);color:var(--muted);flex:none}
.k.dem .kic{background:var(--demandSoft);color:var(--demandInk)} .k.sup .kic{background:var(--supplySoft);color:var(--supplyInk)}
.k .kic svg{width:14px;height:14px}
.k .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.k .val{font-size:29px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-top:14px;line-height:1;font-variant-numeric:tabular-nums}
.k .val.dem{color:var(--demand)} .k .val.sup{color:var(--supply)}
.k .note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}

.intro{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.intro .half{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--sh2);transition:transform .2s,box-shadow .2s}
.intro .half:hover{transform:translateY(-2px);box-shadow:var(--sh3)}
.badge{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.badge svg{width:22px;height:22px} .badge.dem svg{color:var(--demandInk)} .badge.sup svg{color:var(--supplyInk)}
.badge.dem{background:var(--demandSoft)} .badge.sup{background:var(--supplySoft)}
.intro h4{font-size:18px;color:var(--ink);margin-bottom:8px;font-weight:800;letter-spacing:-.01em}
.intro p{font-size:13.5px;color:var(--body);line-height:1.7}
.intro .ch{font-size:12.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid var(--lineSoft)}
.intro .ch b{color:var(--ink);font-weight:700}
.note-row{font-size:11.5px;color:var(--faint);margin-top:16px;font-style:italic}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 18px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:16px 18px;border-bottom:1px solid var(--lineSoft);color:var(--body);line-height:1.5}
table.t tr:last-child td{border-bottom:none}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
table.t td.lead2{font-weight:700;color:var(--ink)}
tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.bigtable table.t td{font-size:15.5px;padding:20px 18px}
.bigtable .netbig{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.teal{color:var(--supply);font-weight:700}.indigo{color:var(--demand);font-weight:700}
.q3prio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:8px 0 40px}
.q3card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--demand);border-radius:12px;padding:20px 20px 12px}
.q3num{font-size:12px;font-weight:800;color:var(--demand);letter-spacing:.04em}
.q3title{font-size:15px;font-weight:800;color:var(--ink);margin:6px 0 13px;line-height:1.3}
.q3f{margin-bottom:9px}
.q3lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q3val{font-size:12.5px;color:var(--body);line-height:1.45}
@media (max-width:820px){.q3prio{grid-template-columns:1fr}}
.up{color:var(--pos);font-weight:700}.down{color:var(--neg);font-weight:700}
.focus{background:#FAFAFF}

.bl{list-style:none;display:grid;gap:4px}
.bl li{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--lineSoft);font-size:14px;color:var(--body);line-height:1.65}
.bl li:last-child{border-bottom:none}
.bl .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--demandSoft);color:var(--demandInk);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bl li b{color:var(--ink);font-weight:700}

.chart{width:100%;height:auto;display:block}
.cap{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.legend{display:flex;gap:20px;font-size:12px;color:var(--muted);margin:0 0 14px;font-weight:500}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}

.callbox{border-radius:10px;padding:24px 26px;background:var(--demandSoft);border:1px solid var(--demandBd);border-left:4px solid var(--demand)}
.callbox::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(79,70,229,.35),transparent 70%)}
.callbox h4{color:var(--ink);font-size:16px;margin-bottom:14px;font-weight:800;letter-spacing:-.01em;position:relative}
.callbox p{font-size:13.5px;color:var(--body);margin-bottom:14px;line-height:1.75;position:relative}
.callbox p:last-child{margin-bottom:0}
.callbox b{color:var(--ink)}

.gloss{margin-top:44px;border-top:1px solid var(--line)}
.gloss details{border-bottom:1px solid var(--lineSoft)}
.gloss summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:13.5px;padding:16px 2px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.gloss summary::-webkit-details-marker{display:none}
.gloss summary::after{content:"+";color:var(--faint);font-weight:400;font-size:20px}
.gloss details[open] summary::after{content:" to "}
.gloss .gd{font-size:13px;color:var(--body);padding:0 2px 18px;max-width:720px;line-height:1.7}
.foot{font-size:11.5px;color:var(--faint);margin-top:48px;padding-top:22px;border-top:1px solid var(--line);text-align:center;line-height:1.9}
.prose{font-size:13.5px;color:var(--body);line-height:1.75} .prose b{color:var(--ink);font-weight:700}

@media (max-width:820px){ .g2.kpis.kpis.five.intro.statband.heroInner{grid-template-columns:1fr} .statband .st{border-right:none;border-bottom:1px solid var(--lineSoft)} .hero h1{font-size:34px} .hper{display:none} }
@media print{ header{position:static} nav.tabs{display:none} .tab{display:block!important} .card:hover.k:hover.intro .half:hover{transform:none} }
/* per-page subsection nav */
.pgtoc{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 4px}
.pgtoc-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
.pgtoc-i{font-family:var(--font);font-size:12px;font-weight:700;color:var(--demandInk);background:var(--demandSoft);border:1px solid var(--demandBd);border-radius:20px;padding:7px 13px;cursor:pointer;transition:.14s}
.pgtoc-i:hover{background:var(--demand);color:#fff;border-color:var(--demand)}
/* free gold mockups */
.fg-block{display:grid;grid-template-columns:196px 1fr;gap:30px;align-items:center;margin:16px 0;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.fg-block img{width:100%;border-radius:16px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(24,26,32,.10)}
.fg-step{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--demand)}
.fg-h{font-size:17px;font-weight:800;color:var(--ink);margin:5px 0 10px;letter-spacing:-.01em}
.fg-txt p{font-size:13.5px;color:var(--body);line-height:1.6;margin:0 0 9px}
@media(max-width:820px){.fg-block{grid-template-columns:1fr;justify-items:start}.fg-block img{max-width:230px}}
.ss-note{font-size:13px;font-weight:800;color:var(--ink);margin:22px 0 2px}
.ss-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.ss-row figure{margin:0}
.ss-row img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(24,26,32,.12);display:block}
.ss-row figcaption{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
@media(max-width:820px){.ss-row{grid-template-columns:1fr}}
/* presentation mode */
#presentbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;font-family:var(--font);font-size:12.5px;font-weight:700;padding:10px;border-radius:9px;border:1px solid var(--demand);background:var(--demandSoft);color:var(--demandInk);cursor:pointer}
#presentbtn:hover{background:var(--demand);color:#fff}
#presentexit{display:none;position:fixed;top:14px;right:16px;z-index:210;font-family:var(--font);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.presenting .rail, body.presenting #railtoggle{display:none}
body.presenting .app{grid-template-columns:1fr}
body.presenting #presentexit{display:inline-flex;align-items:center;gap:6px}
body.presenting .content .wrap{max-width:1120px;margin:0 auto;padding:52px 56px 24px}
body.presenting .pagenav{max-width:1120px;margin:0 auto;padding:8px 56px 56px}
body.presenting .sechdr{padding:16px 56px;background:var(--surface)}
body.presenting .sechdr .sh-n{height:28px;font-size:13px}
body.presenting .sechdr .sh-t{font-size:17.5px}
@media(max-width:920px){.sechdr{padding-left:156px}body.presenting .sechdr{padding-left:56px}}
body.presenting .lead{font-size:clamp(30px,3.6vw,42px)}
@media(max-width:820px){body.presenting .content .wrap{padding:52px 22px 24px}body.presenting .pagenav{padding:8px 22px 44px}}
/* unity logo + sticky section header */
.ulogo{width:20px;height:20px;object-fit:contain;vertical-align:middle}
.sechdr{position:sticky;top:0;z-index:95;background:var(--surface);border-bottom:1px solid var(--line);padding:13px 44px;display:none;box-shadow:0 6px 16px -12px rgba(24,26,32,.35)}
.sechdr.show{display:flex;align-items:center}
.sh-n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 8px;border-radius:7px;background:var(--demand);color:#fff;font-weight:800;font-size:12px;flex:none}
.sh-t{color:var(--ink);font-weight:800;font-size:15px;margin-left:12px}
.sh-sub{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* welcome page */
.wc-kick{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--demand)}
.wc-title{font-size:clamp(34px,4.6vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink);margin:16px 0 0}
.wc-per{font-size:14px;color:var(--muted);font-weight:600;margin-top:14px}
.wc-concl{font-size:clamp(15px,1.6vw,18px);color:var(--body);max-width:720px;line-height:1.55;margin-top:20px}
.wc-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:46px;margin-top:46px;align-items:start}
@media(max-width:820px){.wc-grid{grid-template-columns:1fr;gap:30px}}
.wc-lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wc-ag{border-top:1px solid var(--line)}

.gb-card{border:1px solid var(--line);border-radius:16px;padding:16px 22px 10px;background:var(--surface)}
.gb-card.sup{border-top:3px solid var(--supply)}
.gb-card.dem{border-top:3px solid var(--demand)}
.gb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.gb-head h3{font-size:16px;font-weight:850;color:var(--ink);margin:0;letter-spacing:-.01em}
.gb-item{padding:11px 0;border-top:1px solid var(--lineSoft);font-size:12.5px;color:var(--body);line-height:1.5}
.gb-item:first-of-type{border-top:none}
.gb-item .git{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:13.5px;font-weight:700;color:var(--ink)}
@media(max-width:820px){.gb-grid{grid-template-columns:1fr}}
/* Agenda: 3-col grid, compact to fit one screen */
.agenda-page{max-width:1160px;margin-top:0}
.agenda-label{margin-bottom:8px}
.ap-title{font-size:27px;margin:2px 0 14px}
.agenda-list{grid-template-columns:repeat(3,1fr);gap:9px 12px}
.ag-row{padding:10px 14px}
.ag-t{font-size:14px}
.ag-d{font-size:11px;line-height:1.35}
.ag-time{font-size:10px;padding:3px 8px}
.ap-total{margin-top:12px;font-size:11px}
@media(max-width:1080px){.agenda-list{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.agenda-list{grid-template-columns:1fr}}
/* Floating on-this-page nav (right rail) */
.onpage{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:88;display:flex;flex-direction:column;gap:9px;align-items:flex-end;max-width:250px}
.op-i{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:9px 15px;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:650;color:var(--muted);box-shadow:0 8px 22px -14px rgba(0,0,0,.4);transition:.15s}
.op-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.op-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:.15s}
.op-i:hover{color:var(--ink);border-color:var(--demand)}
.op-i.on{color:var(--demandInk);border-color:var(--demand);font-weight:800}
.op-i.on .op-dot{background:var(--demand);box-shadow:0 0 0 4px var(--demandSoft)}
@media(max-width:1240px){.onpage{display:none}}
@media(min-width:1241px){body.onpage-on #main{padding-right:262px}}
body.presenting .onpage{right:18px;display:flex}
.rl-home .rl-dot{border-color:var(--demand)}
/* sidebar rail layout */
#scrollprog{position:fixed;top:0;left:0;height:3px;background:var(--demand);width:0;z-index:200;transition:width .08s linear}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:26px 18px 16px}
.rail-top{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.rail .brand{font-size:16px}
.rail-kick{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.rail-cli{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:5px;line-height:1.25}
.rail-per{font-size:11.5px;color:var(--muted);margin-top:5px}
.rail-nav{position:relative;flex:1;overflow:auto;padding:6px 0}
.rl-grp{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rl-ghead{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:0 10px;margin:15px 0 5px}
.rl{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;padding:9px 10px;text-align:left;font-family:var(--font);border-radius:9px;transition:background .13s}
.rl-n{font-size:11px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.rl-lbl{font-size:13.5px;font-weight:600;color:var(--body);line-height:1.25}
.rl:hover{background:var(--lineSoft)}
.rl.on{background:var(--demandSoft)}
.rl.on .rl-lbl{color:var(--demandInk);font-weight:800}
.rl.on .rl-n{color:var(--demand)}
.rail-foot{font-size:10.5px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line);line-height:1.5}
.content{min-width:0}
.content .wrap{max-width:1600px;margin:0;padding:44px 300px 18px 60px}
.pagenav{max-width:1600px;margin:0;padding:6px 300px 52px 60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
@media(max-width:1240px){.content .wrap{padding:40px 44px 18px}.pagenav{padding:6px 44px 52px}}
.pgbtn{font-family:var(--font);font-size:13px;font-weight:700;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;max-width:280px}
.pgbtn .pg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgbtn .pg-ar{color:var(--muted);font-size:17px;line-height:1;flex:none}
.upnext{display:flex;align-items:center;gap:14px;width:100%;margin-top:44px;padding:16px 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-family:var(--font);text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
.upnext:hover{border-color:var(--demand);transform:translateY(-2px);box-shadow:0 8px 22px rgba(91,80,214,.12)}
.upnext .un-txt{display:flex;flex-direction:column;gap:3px}
.upnext .un-k{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.upnext .un-t{font-size:17px;font-weight:850;color:var(--ink);letter-spacing:-.01em}
.upnext .un-ar{margin-left:auto;font-size:22px;color:var(--demand);transition:transform .15s}
.upnext:hover .un-ar{transform:translateX(4px)}
#tip{position:fixed;z-index:400;pointer-events:none;background:#12141c;color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.30);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap;font-family:var(--font)}
#tip.on{opacity:1;transform:none}
svg [data-tip]{transition:opacity .12s;cursor:default}
svg [data-tip]:hover{opacity:.82}
.m2e-flow{display:flex;align-items:stretch;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.m2e-step{flex:1 1 0;min-width:150px;border:1px solid var(--line);border-top:3px solid var(--supply);border-radius:14px;padding:15px 16px;background:var(--surface)}
.m2e-step .ms-n{width:24px;height:24px;border-radius:50%;background:var(--supplySoft);color:var(--supplyInk);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.m2e-step .ms-t{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:5px;line-height:1.25}
.m2e-step .ms-d{font-size:11.5px;color:var(--body);line-height:1.45}
.m2e-arrow{display:flex;align-items:center;color:var(--faint);font-size:18px;flex:none}
@media(max-width:820px){.m2e-flow{flex-direction:column}.m2e-arrow{transform:rotate(90deg);justify-content:center;padding:2px 0}}
details.collapse{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details.collapse>summary{list-style:none;cursor:pointer;padding:14px 24px;font-size:13.5px;font-weight:700;color:var(--demandInk);display:flex;align-items:center;justify-content:space-between;gap:10px}
details.collapse>summary::-webkit-details-marker{display:none}
details.collapse>summary::after{content:'▸';color:var(--muted);font-size:12px;transition:transform .18s}
details.collapse[open]>summary::after{transform:rotate(90deg)}
details.collapse>summary:hover{background:var(--lineSoft)}
details.collapse[open]>summary{border-bottom:1px solid var(--lineSoft)}
details.collapse .cbody{padding:8px 0 4px}
.pgbtn:hover:not(:disabled) .pg-ar{color:var(--demand)}
.pgbtn:hover:not(:disabled){border-color:var(--demand);color:var(--demand)}
.pgbtn:disabled{opacity:.35;cursor:default}
.pgpos{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
#railtoggle{display:none}
@media(max-width:920px){
 .app{grid-template-columns:1fr}
 .rail{position:fixed;left:0;top:0;bottom:0;width:252px;height:auto;z-index:150;transform:translateX(-101%);transition:transform .2s;box-shadow:0 0 44px rgba(0,0,0,.14)}
 body.rail-open .rail{transform:none}
 #railtoggle{display:inline-flex;align-items:center;gap:6px;position:fixed;top:12px;left:12px;z-index:160;font-family:var(--font);font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
 .content .wrap{padding:58px 20px 18px}
 .pagenav{padding:6px 20px 44px}
}
/* presentation stage (legacy, unused) */
body.on-cover header, body.on-cover #stagebar{display:none}
.cover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.cover-inner{position:relative;border-radius:22px;overflow:hidden;padding:60px 56px;background:linear-gradient(125deg,#25203F 0%,#373063 52%,#5146A8 100%);box-shadow:0 24px 60px -34px rgba(37,32,63,.6)}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#C9C5F2;margin-bottom:22px}
.cover h1{font-size:clamp(40px,6vw,70px);font-weight:800;letter-spacing:-.03em;line-height:1.03;color:#fff;margin:0}
.cover .per{font-size:15px;color:#CFCBE8;margin-top:18px;font-weight:600}
.cover .concl{font-size:clamp(15.5px,1.7vw,19px);color:#E9E7FF;max-width:760px;margin-top:24px;line-height:1.55}
.cover .ctitles{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.cover .ctitles span{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:7px 14px 7px 7px;font-size:13px;font-weight:600;color:#fff}
.cover .cbtns{display:flex;gap:13px;margin-top:36px;flex-wrap:wrap}
.cover .cbtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:14px;font-weight:700;padding:13px 22px;border-radius:12px;cursor:pointer;border:0}
.cover .cbtn.primary{background:#fff;color:#2A2350}
.cover .cbtn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
.agenda-grid{margin-top:10px}
.ag-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:18px;padding:20px 10px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.ag-row:last-child{border-bottom:1px solid var(--line)}
.ag-row:hover{background:var(--demandSoft)}
.ag-num{font-size:15px;font-weight:800;color:var(--demand)}
.ag-ttl{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.ag-desc{font-size:13px;color:var(--muted);margin-top:3px}
.ag-arw{color:var(--muted);font-size:18px}
#stagebar{position:fixed;left:0;right:0;bottom:0;z-index:120;background:rgba(255,255,255,.93);backdrop-filter:saturate(160%) blur(10px);border-top:1px solid var(--line)}
#stageprog{height:2px;background:var(--demand);width:0;transition:width .3s ease}
.stage-in{max-width:1160px;margin:0 auto;padding:9px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.stage-sec{font-size:12.5px;font-weight:700;color:var(--ink)}
.stage-sec b{color:var(--muted);font-weight:600}
.stage-nav{display:flex;align-items:center;gap:9px}
.stage-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stage-nav button:hover:not(:disabled){border-color:var(--demand);color:var(--demand)}
.stage-nav button:disabled{opacity:.35;cursor:default}
.stage-count{font-size:12.5px;font-weight:700;color:var(--muted);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
main.wrap{padding-bottom:64px}
@media(max-width:820px){.stage-in{padding:8px 18px}.ag-ttl{font-size:16px}.cover-inner{padding:44px 30px}}
</style>

function vbars(labels, series, opts={}){
 const W=560,H=280, pad={l:8,r:8,t:32,b:42}, p='v'+(SN++)+'_';

 {let lx=W/2-84;series.forEach(s=>{g+=`<rect x="${lx}" y="6" width="11" height="11" rx="3" fill="${gf(s.c,p)}"/><text x="${lx+17}" y="15.5" font-size="12.5" fill="${C.muted}">${s.name}</text>`;lx+=100;});}
 labels.forEach((lb,i)=>{
 const gx=pad.l+i*gw, bw=Math.min(56,(gw*0.62)/series.length);
 const groupW=bw*series.length+(series.length-1)*10, startX=gx+(gw-groupW)/2;
 series.forEach((s,si)=>{const v=s.v[i], bh=(H-pad.t-pad.b)*v/max, bx=startX+si*(bw+10), by=H-pad.b-bh;
 g+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" fill="${gf(s.c,p)}" data-tip="${lb} · ${s.name}: ${v.toLocaleString()}"/>`;});
 g+=`<text x="${gx+gw/2}" y="${H-pad.b+22}" font-size="12.5" fill="${C.muted}" text-anchor="middle">${lb}</text>`;
 });
 g+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="${C.line}"/>`;

}

function updNotes(){
 var d=document.getElementById('spk')||buildSpk();
 var n=NOTES[cur];
 if(!n){d.style.display='none';return;}
 d.style.display='';
 d.querySelector('.spk-t').textContent=n.t;
 d.querySelector('.spk-b').innerHTML=n.b.map(function(x){return '<li>'+x+'</li>';}).join('');
 d.querySelector('.spk-num').textContent=n.n||'';
 d.querySelector('.spk-ask').textContent=n.ask||'';
}
function buildSpk(){
 var css=document.createElement('style');
 css.textContent="#spk{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#12141c;color:#E7E9F0;border-top:2px solid #5B50D6;box-shadow:0 -8px 30px rgba(0,0,0,.4);font-family:var(--font);max-height:44vh;overflow:auto;transition:transform .2s}#spk.hid{transform:translateY(calc(100% - 36px))}#spk .spk-bar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:#1b1e29;cursor:pointer;position:sticky;top:0}#spk .spk-badge{font-size:10px;font-weight:800;letter-spacing:.12em;color:#B9B2F5;text-transform:uppercase}#spk .spk-t{font-size:13px;font-weight:800;color:#fff}#spk .spk-hint{margin-left:auto;font-size:11px;color:#8A90A2}#spk .spk-body{padding:14px 22px 22px;display:grid;grid-template-columns:1fr 320px;gap:26px}#spk .spk-b{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px;line-height:1.55}#spk .spk-side{display:grid;gap:12px;align-content:start}#spk .spk-k{background:#1b1e29;border:1px solid #2a2e3d;border-radius:10px;padding:11px 14px}#spk .spk-k .lab{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8A90A2;margin-bottom:5px}#spk .spk-num{font-size:15px;font-weight:800;color:#fff}#spk .spk-ask{font-size:13.5px;font-weight:700;color:#8FE3B4;line-height:1.45}@media(max-width:820px){#spk .spk-body{grid-template-columns:1fr}}";
 document.head.appendChild(css);
 var d=document.createElement('div');d.id='spk';
 d.innerHTML='<div class="spk-bar"><span class="spk-badge">Presenter notes</span><span class="spk-t"></span><span class="spk-hint">click bar or press N to hide</span></div><div class="spk-body"><ul class="spk-b"></ul><div class="spk-side"><div class="spk-k"><div class="lab">Number to land</div><div class="spk-num"></div></div><div class="spk-k"><div class="lab">The ask</div><div class="spk-ask"></div></div></div></div>';
 document.body.appendChild(d);
 d.querySelector('.spk-bar').onclick=function(){d.classList.toggle('hid');};
 return d;
}
document.addEventListener('keydown',function(e){if((e.key==='n'||e.key==='N')&&!/input|textarea|select/i.test((e.target&&e.target.tagName)||'')){var d=document.getElementById('spk')||buildSpk();d.classList.toggle('hid');}});

function animateCover(){
 document.querySelectorAll('[data-to]').forEach(el=>{
 const to=parseFloat(el.dataset.to), dec=+(el.dataset.dec||0), pre=el.dataset.pre||'', suf=el.dataset.suf||'', comma=el.dataset.comma==='1';
 const fmt=v=>pre+(comma?Math.round(v).toLocaleString():v.toFixed(dec))+suf;
 if(!window.requestAnimationFrame || (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)){ el.textContent=fmt(to); return; }
 const dur=1200, t0=performance.now();
 (function step(t){let p=Math.min((t-t0)/dur,1);p=1-Math.pow(1-p,3);el.textContent=fmt(to*p);if(p<1)requestAnimationFrame(step);})(t0);
 setTimeout(()=>{el.textContent=fmt(to);}, dur+220);
 });
}
const progEl=document.getElementById('scrollprog');
function updProg(){ var h=document.documentElement.scrollHeight-window.innerHeight; progEl.style.width=(h>4?(window.scrollY/h*100):0)+'%'; }
window.addEventListener('scroll',updProg,{passive:true});
window.addEventListener('scroll',tocSpy,{passive:true});
window.addEventListener('resize',updProg);
function nameOf(id){
 if(id==='welcome') return 'Welcome';
 if(id==='agenda') return 'Agenda';
 if(id&&id.indexOf('div:')===0) return id.slice(4);
 var a=AGENDA.find(function(x){return x.id===id;}); return a?a.t:'';
}
function updNav(){
 var i=ORDER.indexOf(cur);
 var pv=document.getElementById('pgprev'), nx=document.getElementById('pgnext'), pos=document.getElementById('pgpos');
 pv.disabled=i<=0; nx.disabled=i>=ORDER.length-1;
 pv.innerHTML = i>0 ? '<span class="pg-ar">&lsaquo;</span><span class="pg-nm">'+nameOf(ORDER[i-1])+'</span>' : '<span class="pg-ar">&lsaquo;</span> Previous';
 nx.innerHTML = i<ORDER.length-1 ? '<span class="pg-nm">'+nameOf(ORDER[i+1])+'</span><span class="pg-ar">&rsaquo;</span>' : 'Next <span class="pg-ar">&rsaquo;</span>';
 var isDiv=cur.indexOf('div:')===0;
 var aIdx=AGENDA.findIndex(function(a){return a.id===cur;});
 pos.textContent = cur==='welcome' ? 'Welcome' : cur==='agenda' ? 'Agenda' : isDiv ? cur.slice(4) : ((aIdx+1)+' of '+AGENDA.length);
 document.querySelectorAll('.rl,.rl-ghead').forEach(function(b){b.classList.toggle('on',b.dataset.id===cur);});
 var act=document.querySelector('.rl.on,.rl-ghead.on'); if(act) act.scrollIntoView({block:'nearest'});
 var sh=document.getElementById('sechdr');
 if(aIdx>=0){ var a=AGENDA[aIdx]; sh.className='sechdr show'; sh.innerHTML='<span class="sh-n">'+pad(aIdx+1)+'</span><span class="sh-t">'+a.t+'</span><span class="sh-sub">'+a.d+'</span>'; }
 else { sh.className='sechdr'; sh.innerHTML=''; }
}
function stepSlide(dir){ var i=ORDER.indexOf(cur); var n=i+dir; if(n>=0 && n<ORDER.length) go(ORDER[n]); }
function injectToc(){
 var old=document.querySelector('.onpage'); if(old) old.remove();
 document.body.classList.remove('onpage-on');
 var heads=[...mainEl.querySelectorAll('.sec h3')];
 if(heads.length<2) return;
 document.body.classList.add('onpage-on');
 heads.forEach(function(h,i){ h.id='sub'+i; });
 var nav=document.createElement('div'); nav.className='onpage';
 nav.innerHTML=heads.map(function(h,i){return '<button class="op-i" data-sub="'+i+'"><span class="op-t">'+h.textContent+'</span><span class="op-dot"></span></button>';}).join('');
 document.body.appendChild(nav);
 nav.querySelectorAll('.op-i').forEach(function(b){ b.onclick=function(){ var h=document.getElementById('sub'+b.dataset.sub); if(h) h.scrollIntoView({behavior:'smooth',block:'start'}); }; });
 tocSpy();
}
function tocSpy(){
 var nav=document.querySelector('.onpage'); if(!nav) return;
 var heads=[...mainEl.querySelectorAll('.sec h3')];
 var active=0;
 heads.forEach(function(h,i){ if(h.getBoundingClientRect().top<=150) active=i; });
 nav.querySelectorAll('.op-i').forEach(function(b,i){ b.classList.toggle('on', i===active); });
}
function staggerIn(tab){
 if(!tab) return;
 var kids=tab.children;
 for(var i=0;i<kids.length;i++){
  var el=kids[i];
  el.style.opacity='0';
  el.style.animation='rise .5s cubic-bezier(.22,.61,.36,1) forwards';
  el.style.animationDelay=(Math.min(i,12)*0.045)+'s';
 }
}
function countUp(el){
 var raw=el.textContent, m=raw.match(/^(\D*?)([\d,]+(?:\.\d+)?)(\D*)$/); if(!m) return;
 var pre=m[1], numStr=m[2], suf=m[3], hasComma=numStr.indexOf(',')>-1;
 var clean=numStr.replace(/,/g,''), dec=(clean.split('.')[1]||'').length, target=parseFloat(clean);
 if(!isFinite(target)) return;
 function fmt(v){ var s=dec?v.toFixed(dec):Math.round(v).toString(); if(hasComma){ var p=s.split('.'); p[0]=(+p[0]).toLocaleString(); s=p.join('.'); } return pre+s+suf; }
 if(!window.requestAnimationFrame || (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)){ el.textContent=fmt(target); return; }
 var dur=850, t0=performance.now();
 (function step(t){ var p=Math.min((t-t0)/dur,1); p=1-Math.pow(1-p,3); el.textContent=fmt(target*p); if(p<1) requestAnimationFrame(step); })(t0);
 setTimeout(function(){ el.textContent=fmt(target); }, dur+160); // guarantee final value even if rAF is throttled
}
var tipEl;
function ensureTip(){ if(!tipEl){ tipEl=document.createElement('div'); tipEl.id='tip'; document.body.appendChild(tipEl); } return tipEl; }
document.addEventListener('mouseover', function(e){ var t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; var tip=ensureTip(); tip.textContent=t.getAttribute('data-tip'); tip.classList.add('on'); });
document.addEventListener('mousemove', function(e){ if(!tipEl||!tipEl.classList.contains('on')) return; var x=e.clientX+14, y=e.clientY-14, w=tipEl.offsetWidth, h=tipEl.offsetHeight; if(x+w>window.innerWidth-8) x=e.clientX-w-14; if(y<8) y=e.clientY+20; tipEl.style.left=x+'px'; tipEl.style.top=y+'px'; });
document.addEventListener('mouseout', function(e){ var t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&tipEl) tipEl.classList.remove('on'); });
function animateStats(tab){ if(tab) tab.querySelectorAll('.k .val, .st .val, .dstat .dbig, .dstat .dd span, .kl-v').forEach(countUp); }
function upNext(id){
 var i=ORDER.indexOf(id); if(i<0||i>=ORDER.length-1) return '';
 var nid=ORDER[i+1];
 return '<button class="upnext" onclick="go(\''+nid+'\')"><span class="un-txt"><span class="un-k">Up next</span><span class="un-t">'+nameOf(nid)+'</span></span><span class="un-ar">&rarr;</span></button>';
}
function go(id){
 cur=id;
 document.body.classList.toggle('on-welcome', id==='welcome');
 document.body.classList.toggle('on-chapter', id.indexOf('div:')===0);
 mainEl.innerHTML=`<section class="tab on">${V[id]}</section>`;
 var tab=mainEl.querySelector('.tab');
 var content = id!=='welcome' && id.indexOf('div:')!==0;
 if(content){ var un=upNext(id); if(un) tab.insertAdjacentHTML('beforeend', un); }
 injectToc();
 window.scrollTo({top:0}); updProg(); updNav(); updNotes();
 document.body.classList.remove('rail-open');
 if(id==='overview'){ requestAnimationFrame(animateCover); }
 else if(content){ staggerIn(tab); animateStats(tab); }
}
railEl.addEventListener('click',e=>{const b=e.target.closest('.rl,.rl-ghead');if(b&&b.dataset.id)go(b.dataset.id)});
document.getElementById('pgprev').onclick=()=>stepSlide(-1);
document.getElementById('pgnext').onclick=()=>stepSlide(1);
document.getElementById('railtoggle').onclick=()=>document.body.classList.toggle('rail-open');
function present(on){
 document.body.classList.toggle('presenting',on);
 try{ if(on){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } else if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen(); } }catch(e){}
 window.scrollTo({top:0});
}
document.getElementById('presentbtn').onclick=()=>present(true);
document.getElementById('presentexit').onclick=()=>present(false);
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('presenting'); });
document.addEventListener('keydown',function(e){
 if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
 if(e.key==='Escape'){ present(false); return; }
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();stepSlide(1);}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stepSlide(-1);}
});

go('welcome');
</script>
